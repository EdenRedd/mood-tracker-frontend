<style>
  :host {
    font-family: "Inter", system-ui, sans-serif;
    display: block;
    min-height: 100dvh;
    background: linear-gradient(180deg, #f7f9ff 0%, #eef2ff 100%);
    color: #111827;
    padding: 1.5rem;
    box-sizing: border-box;
  }

  .calendar-shell {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100%;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .calendar-card {
    width: min(100%, 520px);
    background: #eff6ff;
    border-radius: 1.25rem;
    box-shadow: 0 24px 72px rgba(15, 23, 42, 0.08);
    padding: 1.5rem;
    border: 1px solid rgba(37, 99, 235, 0.24);
    flex-shrink: 0;
  }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
    background: rgba(59, 130, 246, 0.08);
    border-radius: 1rem;
    padding: 1rem;
  }

  .calendar-subtitle {
    margin: 0 0 0.25rem;
    color: #2563eb;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .calendar-header h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #1d4ed8;
  }

  .controls {
    display: inline-flex;
    gap: 0.5rem;
  }

  .controls button,
  .today-button {
    border: 1px solid rgba(15, 23, 42, 0.12);
    background: white;
    color: #111827;
    border-radius: 0.75rem;
    padding: 0.7rem 0.9rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .controls button:hover,
  .today-button:hover {
    background: #f8fafc;
    transform: translateY(-1px);
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0.5rem;
  }

  .weekday {
    font-size: 0.85rem;
    font-weight: 700;
    color: #6b7280;
    text-align: center;
  }

  .date-cell {
    min-height: 3rem;
    display: grid;
    place-items: center;
    border-radius: 0.75rem;
    color: #111827;
    font-weight: 500;
    background: #f8fafc;
    position: relative;
  }

  .date-cell[data-mood]:hover::after {
    content: attr(data-mood);
    position: absolute;
    top: 0.4rem;
    right: 0.4rem;
    padding: 0.2rem 0.45rem;
    border-radius: 0.5rem;
    background: rgba(15, 23, 42, 0.9);
    color: white;
    font-size: 0.75rem;
    white-space: nowrap;
    z-index: 1;
  }

  .date-cell.other-month {
    color: #9ca3af;
    background: transparent;
  }

  .date-cell.current-month {
  }

  .date-cell.clickable {
    cursor: pointer;
  }

  .date-cell.selected {
    box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.55);
  }

  .date-cell.today {
    background: #2563eb;
    color: white;
    box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
  }

  .date-number {
    z-index: 1;
  }

  .mood-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    position: absolute;
    right: 0.6rem;
    bottom: 0.5rem;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
    background: #9ca3af; /* default color for custom/other emotions */
  }

  .mood-dot[data-mood="happy"] { background: #10b981; }
  .mood-dot[data-mood="neutral"] { background: #f59e0b; }
  .mood-dot[data-mood="sad"] { background: #ef4444; }

  .mood-options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }

  .custom-emotions-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    width: 100%;
  }

  .custom-emotion-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
  }

  .custom-remove-button {
    width: 2rem;
    height: 2rem;
    border-radius: 999px;
    border: 1px solid rgba(220, 38, 38, 0.2);
    color: #dc2626;
    background: white;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .custom-remove-button:hover {
    background: #fee2e2;
  }

  .today-button.active {
    background: #2563eb;
    color: white;
    border-color: rgba(37, 99, 235, 0.4);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: grid;
    place-items: center;
    padding: 1rem;
    z-index: 10;
  }

  .modal {
    width: min(100%, 420px);
    background: white;
    border-radius: 1rem;
    padding: 1.5rem;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.24);
    border: 1px solid rgba(15, 23, 42, 0.08);
  }

  .modal-title {
    margin: 0 0 1rem 0;
    font-size: 1.1rem;
    color: #111827;
  }

  .modal-close-button {
    margin-top: 1rem;
    width: 100%;
  }

  .calendar-footer {
    margin-top: 1.25rem;
    display: flex;
    justify-content: flex-end;
  }

  .today-button {
    font-weight: 600;
    color: #2563eb;
    border-color: rgba(37, 99, 235, 0.32);
    background: rgba(59, 130, 246, 0.08);
  }

  .exit-button {
    margin-left: 0.5rem;
    border: 1px solid rgba(15, 23, 42, 0.12);
    background: transparent;
    color: #ef4444;
    border-radius: 0.75rem;
    padding: 0.7rem 0.9rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .exit-button:hover {
    background: #fff1f2;
    transform: translateY(-1px);
  }

  @media (max-width: 520px) {
    :host {
      padding: 1rem;
    }

    .calendar-card {
      padding: 1rem;
    }

    .calendar-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .controls {
      width: 100%;
      justify-content: flex-start;
    }
  }
</style>

<main class="calendar-shell">
  <section class="calendar-card" (wheel)="onScroll($event)">
    <header class="calendar-header">
      <div>
        <p class="calendar-subtitle">Mood tracker calendar</p>
        <h1>{{ monthName() }} {{ year() }}</h1>
      </div>

      <div class="controls">
        <button type="button" (click)="previousMonth()">‹</button>
        <button type="button" (click)="nextMonth()">›</button>
      </div>
    </header>

    <div class="calendar-grid">
      <div class="weekday" *ngFor="let weekday of weekDays">{{ weekday }}</div>

      <ng-container *ngFor="let week of calendar()">
        <div
          class="date-cell"
          *ngFor="let day of week"
          [attr.data-mood]="day.logged ? day.mood : null"
          [attr.title]="day.logged ? day.mood : null"
          [class.other-month]="!day.currentMonth"
          [class.today]="day.today"
          [class.current-month]="day.currentMonth"
          [class.clickable]="day.currentMonth"
          [class.selected]="day.key === selectedDate()"
          (click)="selectDay(day)"
        >
          <div class="date-number">{{ day.label }}</div>
          <div
            *ngIf="day.logged"
            class="mood-dot"
            [attr.data-mood]="day.mood"
            [style.background]="getMoodColor(day.mood)"
          ></div>
        </div>
      </ng-container>
    </div>

    <div class="modal-backdrop" *ngIf="moodModalOpen()" (click)="closeModal()">
      <div class="modal" (click)="$event.stopPropagation()">
        <p class="modal-title">Pick your mood for <strong>{{ selectedDate() }}</strong></p>

        <div class="mood-options">
          <button
            type="button"
            class="today-button"
            [class.active]="selectedMood() === 'happy'"
            (click)="saveEntry('happy')"
          >
            Happy
          </button>
          <button
            type="button"
            class="today-button"
            [class.active]="selectedMood() === 'neutral'"
            (click)="saveEntry('neutral')"
          >
            Neutral
          </button>
          <button
            type="button"
            class="today-button"
            [class.active]="selectedMood() === 'sad'"
            (click)="saveEntry('sad')"
          >
            Sad
          </button>

          <!-- Custom emotions list -->
          <div class="custom-emotions-list">
            <div *ngFor="let em of customEmotions()" class="custom-emotion-row">
              <button
                type="button"
                class="today-button"
                [class.active]="selectedMood() === em"
                (click)="saveEntry(em)"
              >
                {{ em }}
              </button>
              <button
                type="button"
                class="custom-remove-button"
                title="Remove custom mood"
                (click)="removeCustomEmotion(em); $event.stopPropagation()"
              >
                ×
              </button>
            </div>
          </div>

          <!-- Input for creating a custom emotion -->
          <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem;width:100%">
            <input
              type="text"
              placeholder="Create custom emotion"
              [value]="customEmotionInput()"
              (input)="customEmotionInput.set($any($event.target).value)"
              style="flex:1;padding:0.6rem;border-radius:0.5rem;border:1px solid rgba(15,23,42,0.08)"
            />
            <button type="button" class="today-button" (click)="saveCustomEmotion()">Add</button>
          </div>
        </div>

        <button type="button" class="exit-button modal-close-button" (click)="closeModal()">
          Cancel
        </button>
      </div>
    </div>

    <footer class="calendar-footer">
      <button type="button" class="today-button" (click)="resetToday()">Today!</button>
      <button type="button" class="today-button" (click)="toggleChart()">
        {{ chartVisible() ? 'Hide month chart' : 'Show month chart' }}
      </button>
      <button type="button" class="today-button" (click)="logCurrentMood()">Log mood</button>
      <button type="button" class="exit-button" routerLink="/login">Exit to login</button>
    </footer>
  </section>

  <app-mood-pie-chart
    *ngIf="chartVisible()"
    [moods]="moods()"
    [month]="month()"
    [year]="year()"
  ></app-mood-pie-chart>
</main>
