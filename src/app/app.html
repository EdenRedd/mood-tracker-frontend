<style>
  :host {
    font-family: "Inter", system-ui, sans-serif;
    display: block;
    min-height: 100dvh;
    background: linear-gradient(180deg, #f7f9ff 0%, #eef2ff 100%);
    color: #111827;
    padding: 1.5rem;
    box-sizing: border-box;
  }

  .calendar-shell {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100%;
  }

  .calendar-card {
    width: min(100%, 520px);
    background: white;
    border-radius: 1.25rem;
    box-shadow: 0 24px 72px rgba(15, 23, 42, 0.08);
    padding: 1.5rem;
    border: 1px solid rgba(37, 99, 235, 0.24);
  }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
    background: rgba(59, 130, 246, 0.08);
    border-radius: 1rem;
    padding: 1rem;
  }

  .calendar-subtitle {
    margin: 0 0 0.25rem;
    color: #2563eb;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .calendar-header h1 {
    margin: 0;
    font-size: 1.8rem;
    color: #1d4ed8;
  }

  .controls {
    display: inline-flex;
    gap: 0.5rem;
  }

  .controls button,
  .today-button {
    border: 1px solid rgba(15, 23, 42, 0.12);
    background: white;
    color: #111827;
    border-radius: 0.75rem;
    padding: 0.7rem 0.9rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .controls button:hover,
  .today-button:hover {
    background: #f8fafc;
    transform: translateY(-1px);
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0.5rem;
  }

  .weekday {
    font-size: 0.85rem;
    font-weight: 700;
    color: #6b7280;
    text-align: center;
  }

  .date-cell {
    min-height: 3rem;
    display: grid;
    place-items: center;
    border-radius: 0.75rem;
    color: #111827;
    font-weight: 500;
    background: #f8fafc;
  }

  .date-cell.other-month {
    color: #9ca3af;
    background: transparent;
  }

  .date-cell.today {
    background: #2563eb;
    color: white;
    box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
  }

  .calendar-footer {
    margin-top: 1.25rem;
    display: flex;
    justify-content: flex-end;
  }

  .today-button {
    font-weight: 600;
    color: #2563eb;
    border-color: rgba(37, 99, 235, 0.32);
    background: rgba(59, 130, 246, 0.08);
  }

  @media (max-width: 520px) {
    :host {
      padding: 1rem;
    }

    .calendar-card {
      padding: 1rem;
    }

    .calendar-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .controls {
      width: 100%;
      justify-content: flex-start;
    }
  }
</style>

<main class="calendar-shell">
  <section class="calendar-card">
    <header class="calendar-header">
      <div>
        <p class="calendar-subtitle">Mood tracker calendar</p>
        <h1>{{ monthName() }} {{ year() }}</h1>
      </div>

      <div class="controls">
        <button type="button" (click)="previousMonth()">‹</button>
        <button type="button" (click)="nextMonth()">›</button>
      </div>
    </header>

    <div class="calendar-grid">
      <div class="weekday" *ngFor="let weekday of weekDays">{{ weekday }}</div>

      <ng-container *ngFor="let week of calendar()">
        <div
          class="date-cell"
          *ngFor="let day of week"
          [class.other-month]="!day.currentMonth"
          [class.today]="day.today"
        >
          {{ day.label }}
        </div>
      </ng-container>
    </div>

    <footer class="calendar-footer">
      <button type="button" class="today-button" (click)="resetToday()">Today!</button>
    </footer>
  </section>
</main>
